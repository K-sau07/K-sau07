<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430"
     role="img" aria-label="Terminal: whoami, focus, building, status">
  <defs>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#13161F"/><stop offset="100%" stop-color="#0A0C13"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#242836"/><stop offset="100%" stop-color="#191C27"/>
    </linearGradient>
    <filter id="aur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="58"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <clipPath id="round"><rect x="24" y="18" width="1152" height="394" rx="12"/></clipPath>
    <clipPath id="c0"><rect x="52" y="0" width="0" height="430">
      <animate attributeName="width" values="0;0;90;90;0" keyTimes="0.0000;0.0222;0.0722;0.9444;1.0000" dur="18.0s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="c1"><rect x="52" y="0" width="0" height="430">
      <animate attributeName="width" values="0;0;430;430;0" keyTimes="0.0000;0.0778;0.1278;0.9444;1.0000" dur="18.0s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="c2"><rect x="52" y="0" width="0" height="430">
      <animate attributeName="width" values="0;0;84;84;0" keyTimes="0.0000;0.1556;0.2056;0.9444;1.0000" dur="18.0s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="c3"><rect x="52" y="0" width="0" height="430">
      <animate attributeName="width" values="0;0;540;540;0" keyTimes="0.0000;0.2111;0.2611;0.9444;1.0000" dur="18.0s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="c4"><rect x="52" y="0" width="0" height="430">
      <animate attributeName="width" values="0;0;105;105;0" keyTimes="0.0000;0.3000;0.3500;0.9444;1.0000" dur="18.0s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="c5"><rect x="52" y="0" width="0" height="430">
      <animate attributeName="width" values="0;0;500;500;0" keyTimes="0.0000;0.3556;0.4056;0.9444;1.0000" dur="18.0s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="c6"><rect x="52" y="0" width="0" height="430">
      <animate attributeName="width" values="0;0;90;90;0" keyTimes="0.0000;0.4444;0.4944;0.9444;1.0000" dur="18.0s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="c7"><rect x="52" y="0" width="0" height="430">
      <animate attributeName="width" values="0;0;400;400;0" keyTimes="0.0000;0.5000;0.5500;0.9444;1.0000" dur="18.0s" repeatCount="indefinite"/>
    </rect></clipPath>
  </defs>

  <rect width="1200" height="430" fill="#080A10"/>

  <g clip-path="url(#round)">
    <rect x="24" y="18" width="1152" height="394" fill="url(#win)"/>
    <ellipse cx="260" cy="320" rx="240" ry="120" fill="#7C3AED" opacity=".22" filter="url(#aur)">
      <animate attributeName="cx" values="260;820;260" dur="26s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="900" cy="120" rx="220" ry="110" fill="#0891B2" opacity=".18" filter="url(#aur)">
      <animate attributeName="cx" values="900;420;900" dur="31s" repeatCount="indefinite"/>
    </ellipse>
    <rect x="24" y="18" width="1152" height="40" fill="url(#bar)"/>
  </g>
  <rect x="24" y="18" width="1152" height="394" rx="12" fill="none" stroke="#FFFFFF" stroke-opacity=".13"/>
  <line x1="24" y1="58" x2="1176" y2="58" stroke="#FFFFFF" stroke-opacity=".09"/>

  <g>
    <circle cx="50" cy="38" r="6" fill="#FF5F57"/>
    <circle cx="72" cy="38" r="6" fill="#FEBC2E"/>
    <circle cx="94" cy="38" r="6" fill="#28C840"/>
  </g>
  <text x="600" y="43" text-anchor="middle" fill="#6B7285"
        font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12"
        letter-spacing="1.5">saurabh — zsh</text>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15.5">
    <text x="56" y="108" fill="#4F5566">$</text>
    <g clip-path="url(#c0)">
      <text x="80" y="108" fill="#E8EBF2">whoami</text>
    </g>
    <g clip-path="url(#c1)">
      <text x="56" y="136" fill="#A78BFA">saurabh kashyap · software engineer · boston</text>
    </g>
    <text x="56" y="188" fill="#4F5566">$</text>
    <g clip-path="url(#c2)">
      <text x="80" y="188" fill="#E8EBF2">focus</text>
    </g>
    <g clip-path="url(#c3)">
      <text x="56" y="216" fill="#22D3EE">distributed backends · java &amp; spring · aws · llm systems</text>
    </g>
    <text x="56" y="268" fill="#4F5566">$</text>
    <g clip-path="url(#c4)">
      <text x="80" y="268" fill="#E8EBF2">building</text>
    </g>
    <g clip-path="url(#c5)">
      <text x="56" y="296" fill="#FBBF24">tassist · watchdog · openlens · ecoplate · ghost os</text>
    </g>
    <text x="56" y="348" fill="#4F5566">$</text>
    <g clip-path="url(#c6)">
      <text x="80" y="348" fill="#E8EBF2">status</text>
    </g>
    <g clip-path="url(#c7)">
      <text x="56" y="376" fill="#34D399">open to swe roles · ms northeastern '26</text>
    </g>
  </g>

  <rect x="462" y="362" width="9" height="17" fill="#E8EBF2">
    <animate attributeName="opacity" values="1;1;0;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <rect width="1200" height="430" filter="url(#grain)" opacity=".11"/>
</svg>

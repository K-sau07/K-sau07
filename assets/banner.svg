<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360"
     role="img" aria-label="Saurabh Kashyap — Software Engineer, Boston">
  <defs>
    <!-- deep space base -->
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0A0D18"/>
      <stop offset="50%"  stop-color="#0E1120"/>
      <stop offset="100%" stop-color="#090B14"/>
    </linearGradient>

    <!-- shimmer that sweeps through the name -->
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="34%"  stop-color="#FFFFFF"/>
      <stop offset="44%"  stop-color="#A78BFA"/>
      <stop offset="52%"  stop-color="#22D3EE"/>
      <stop offset="60%"  stop-color="#FBBF24"/>
      <stop offset="70%"  stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
      <animateTransform attributeName="gradientTransform" type="translate"
                        values="-1.4 0; 1.4 0; -1.4 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="serif" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#8B93A7"/>
      <stop offset="50%"  stop-color="#C7CEDC"/>
      <stop offset="100%" stop-color="#8B93A7"/>
      <animateTransform attributeName="gradientTransform" type="translate"
                        values="-1 0; 1 0; -1 0" dur="9s" repeatCount="indefinite"/>
    </linearGradient>

    <filter id="aurora" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="64"/>
    </filter>
    <filter id="bloom" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <radialGradient id="vig" cx="50%" cy="48%" r="76%">
      <stop offset="48%"  stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity=".82"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="360" fill="url(#space)"/>

  <!-- aurora: violet, cyan, amber drifting independently -->
  <g filter="url(#aurora)">
    <ellipse cx="300" cy="150" rx="250" ry="130" fill="#7C3AED" opacity=".30">
      <animate attributeName="cx" values="300;520;300" dur="24s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".30;.50;.30" dur="11s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="880" cy="170" rx="230" ry="125" fill="#0891B2" opacity=".30">
      <animate attributeName="cx" values="880;680;880" dur="29s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".30;.14;.30" dur="13s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="600" cy="300" rx="300" ry="90" fill="#B45309" opacity=".20">
      <animate attributeName="cy" values="300;255;300" dur="19s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".20;.34;.20" dur="16s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- constellation -->
  <g stroke="#FFFFFF" stroke-opacity=".12" fill="none">
    <path d="M120 70 L230 132 L330 84 L452 140"/>
    <path d="M760 96 L880 60 L1000 118 L1094 72"/>
    <path d="M180 286 L300 246 L410 300"/>
    <path d="M820 296 L940 254 L1060 302"/>
  </g>
  <g fill="#FFFFFF">
    <circle cx="120"  cy="70"  r="1.9" opacity=".6"><animate attributeName="opacity" values=".25;.9;.25" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="230"  cy="132" r="2.4" opacity=".7"><animate attributeName="opacity" values=".9;.3;.9"  dur="4.3s" repeatCount="indefinite"/></circle>
    <circle cx="330"  cy="84"  r="1.7" opacity=".5"><animate attributeName="opacity" values=".2;.8;.2"  dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="452"  cy="140" r="2.1" opacity=".6"><animate attributeName="opacity" values=".7;.2;.7"  dur="5.2s" repeatCount="indefinite"/></circle>
    <circle cx="760"  cy="96"  r="1.8" opacity=".55"><animate attributeName="opacity" values=".2;.85;.2" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="880"  cy="60"  r="2.3" opacity=".7"><animate attributeName="opacity" values=".85;.25;.85" dur="4.9s" repeatCount="indefinite"/></circle>
    <circle cx="1000" cy="118" r="1.9" opacity=".5"><animate attributeName="opacity" values=".3;.9;.3"  dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="1094" cy="72"  r="1.6" opacity=".45"><animate attributeName="opacity" values=".8;.2;.8"  dur="6.1s" repeatCount="indefinite"/></circle>
    <circle cx="180"  cy="286" r="1.7" opacity=".45"><animate attributeName="opacity" values=".2;.7;.2"  dur="4.6s" repeatCount="indefinite"/></circle>
    <circle cx="300"  cy="246" r="2.2" opacity=".6"><animate attributeName="opacity" values=".75;.25;.75" dur="3.3s" repeatCount="indefinite"/></circle>
    <circle cx="410"  cy="300" r="1.8" opacity=".5"><animate attributeName="opacity" values=".25;.8;.25" dur="5.5s" repeatCount="indefinite"/></circle>
    <circle cx="940"  cy="254" r="2.1" opacity=".6"><animate attributeName="opacity" values=".8;.3;.8"  dur="4.1s" repeatCount="indefinite"/></circle>
    <circle cx="1060" cy="302" r="1.7" opacity=".45"><animate attributeName="opacity" values=".3;.85;.3" dur="2.9s" repeatCount="indefinite"/></circle>
  </g>

  <!-- drifting motes -->
  <g fill="#A78BFA" opacity=".5">
    <circle r="2"><animateMotion dur="22s" repeatCount="indefinite"
      path="M100 300 C 300 180, 600 320, 1100 160"/></circle>
  </g>
  <g fill="#22D3EE" opacity=".5">
    <circle r="1.8"><animateMotion dur="27s" repeatCount="indefinite"
      path="M1120 90 C 850 250, 420 60, 80 220"/></circle>
  </g>
  <g fill="#FBBF24" opacity=".45">
    <circle r="1.6"><animateMotion dur="19s" repeatCount="indefinite"
      path="M600 40 C 400 200, 800 260, 600 40"/></circle>
  </g>

  <!-- name -->
  <g filter="url(#bloom)" opacity=".28">
    <text x="600" y="186" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif"
          font-size="102" font-weight="800" letter-spacing="-3.4" fill="#FFFFFF">SAURABH</text>
  </g>
  <text x="600" y="186" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif"
        font-size="102" font-weight="800" letter-spacing="-3.4" fill="url(#sweep)">SAURABH</text>
  <text x="600" y="262" text-anchor="middle" font-family="Georgia,Times New Roman,serif"
        font-style="italic" font-size="78" letter-spacing="-1" fill="url(#serif)">Kashyap</text>

  <!-- status -->
  <g>
    <circle cx="416" cy="304" r="4" fill="#34D399">
      <animate attributeName="opacity" values="1;.25;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="416" cy="304" r="4" fill="none" stroke="#34D399" stroke-opacity=".7">
      <animate attributeName="r" values="4;13;4" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values=".7;0;.7" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>
  <text x="434" y="309" fill="#9BA3B4" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
        font-size="12" letter-spacing="4.5">SOFTWARE ENGINEER · BOSTON · OPEN TO SWE ROLES</text>

  <rect width="1200" height="360" fill="url(#vig)"/>
  <rect width="1200" height="360" filter="url(#grain)" opacity=".12"/>
</svg>

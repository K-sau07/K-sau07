<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430"
     role="img" aria-label="Terminal: whoami, focus, building">
  <defs>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#17191C"/><stop offset="100%" stop-color="#0C0D0F"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#26292E"/><stop offset="100%" stop-color="#1B1D21"/>
    </linearGradient>
    <filter id="fog" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <clipPath id="round"><rect x="24" y="18" width="1152" height="394" rx="12"/></clipPath>
  </defs>

  <rect width="1200" height="430" fill="#000"/>

  <!-- window -->
  <g clip-path="url(#round)">
    <rect x="24" y="18" width="1152" height="394" fill="url(#win)"/>
    <!-- fog drifting behind the text -->
    <ellipse cx="300" cy="300" rx="260" ry="130" fill="#343A42" opacity=".30" filter="url(#fog)">
      <animate attributeName="cx" values="300;780;300" dur="30s" repeatCount="indefinite"/>
    </ellipse>
    <rect x="24" y="18" width="1152" height="40" fill="url(#bar)"/>
  </g>
  <rect x="24" y="18" width="1152" height="394" rx="12" fill="none" stroke="#FFFFFF" stroke-opacity=".13"/>
  <line x1="24" y1="58" x2="1176" y2="58" stroke="#FFFFFF" stroke-opacity=".09"/>

  <!-- traffic lights, monochrome rings -->
  <g fill="none" stroke="#FFFFFF" stroke-opacity=".34">
    <circle cx="50" cy="38" r="6"/><circle cx="72" cy="38" r="6"/><circle cx="94" cy="38" r="6"/>
  </g>
  <text x="600" y="43" text-anchor="middle" fill="#7E848C"
        font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12"
        letter-spacing="1.5">saurabh — zsh</text>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15.5">
    <text x="56" y="104" fill="#5C6169">$</text>
    <text x="80" y="104" fill="#F2F0EA">whoami</text>
    <text x="56" y="132" fill="#A7ADB5">saurabh kashyap · software engineer · boston</text>

    <text x="56" y="184" fill="#5C6169">$</text>
    <text x="80" y="184" fill="#F2F0EA">focus</text>
    <text x="56" y="212" fill="#A7ADB5">distributed backends · java &amp; spring · aws · llm systems</text>

    <text x="56" y="264" fill="#5C6169">$</text>
    <text x="80" y="264" fill="#F2F0EA">principles</text>
    <text x="56" y="292" fill="#A7ADB5">read the code before the docs. measure before optimising.</text>
    <text x="56" y="316" fill="#A7ADB5">ship it, then make it survive production.</text>

    <text x="56" y="368" fill="#5C6169">$</text>
    <text x="80" y="368" fill="#F2F0EA">building</text>
    <text x="56" y="396" fill="#A7ADB5">tassist · watchdog · openlens · ghost os</text>

    <rect x="440" y="383" width="9" height="17" fill="#F2F0EA">
      <animate attributeName="opacity" values="1;1;0;0;1" dur="1.15s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect width="1200" height="430" filter="url(#grain)" opacity=".13"/>
</svg>

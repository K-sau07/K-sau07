<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Saurabh Kashyap, software engineer">
<style>
  .in { opacity: 0; animation: up .9s cubic-bezier(.2,.7,.2,1) forwards; }
  .d1 { animation-delay: .05s } .d2 { animation-delay: .25s } .d3 { animation-delay: .45s } .d4 { animation-delay: .65s }
  @keyframes up { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
  @media (prefers-reduced-motion: reduce) { .in { animation: none; opacity: 1 } }
</style>
<g font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="3" fill="#8b949e" class="in d1">
  <text x="8" y="40">BOSTON</text>
  <circle cx="92" cy="35.5" r="2" fill="#d2a8ff"/>
  <text x="106" y="40">SOFTWARE ENGINEER</text>
</g>
<text x="0" y="148" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif" font-size="96" fill="#e6edf3" class="in d2">Saurabh Kashyap</text>
<text x="4" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#8b949e" class="in d3">I build backends, and the tools that help people understand them.</text>
<g class="in d4">
  <line x1="4" y1="238" x2="1196" y2="238" stroke="#30363d" stroke-width="1"/>
  <g font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#8b949e">
    <text x="4" y="272">3+ years building software</text>
    <text x="300" y="272">M.S. Northeastern University</text>
    <text x="640" y="272">now: <tspan fill="#e6edf3">reposensei.com</tspan></text>
  </g>
</g>
</svg>

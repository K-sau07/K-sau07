<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470"
     role="img" aria-label="TAssist: slides become grounded, cited answers">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#13161F"/><stop offset="100%" stop-color="#0A0C13"/>
    </linearGradient>
    <filter id="fog" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="58"/></filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <clipPath id="rc"><rect x="16" y="14" width="1168" height="442" rx="14"/></clipPath>
  </defs>

  <rect width="1200" height="470" fill="#000"/>
  <g clip-path="url(#rc)">
    <rect x="16" y="14" width="1168" height="442" fill="url(#panel)"/>
    <ellipse cx="600" cy="300" rx="420" ry="170" fill="#7C3AED" opacity=".26" filter="url(#fog)">
      <animate attributeName="cx" values="420;780;420" dur="28s" repeatCount="indefinite"/>
    </ellipse>
  </g>
  <rect x="16" y="14" width="1168" height="442" rx="14" fill="none" stroke="#FFF" stroke-opacity=".12"/>

  <!-- header chips -->
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5">
    <g fill="none" stroke="#FFF" stroke-opacity=".22">
      <rect x="44"  y="42" width="150" height="26" rx="13"/>
      <rect x="206" y="42" width="140" height="26" rx="13"/>
      <rect x="358" y="42" width="128" height="26" rx="13"/>
    </g>
    <text x="119" y="59" text-anchor="middle" fill="#6EE7B7">slide-level citations</text>
    <text x="276" y="59" text-anchor="middle" fill="#C4B5FD">100+ slides</text>
    <text x="422" y="59" text-anchor="middle" fill="#67E8F9">streamed</text>
    <text x="1156" y="59" text-anchor="end" fill="#61666E" letter-spacing="3">TASSIST · GROUNDED ANSWERS</text>
  </g>

  <!-- zone labels -->
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5"
     fill="#5C6169" letter-spacing="3.4">
    <text x="60"  y="112">SOURCE</text>
    <text x="470" y="112">RETRIEVAL</text>
    <text x="900" y="112">ANSWER</text>
  </g>

  <!-- SOURCE: a deck -->
  <g>
    <rect x="76" y="146" width="196" height="132" rx="7" fill="#1C1F23" stroke="#FFF" stroke-opacity=".16"/>
    <rect x="66" y="158" width="196" height="132" rx="7" fill="#20242A" stroke="#FFF" stroke-opacity=".2"/>
    <rect x="56" y="170" width="196" height="132" rx="7" fill="#262A31" stroke="#FFF" stroke-opacity=".28"/>
    <g fill="#8A9098">
      <rect x="76" y="192" width="112" height="7" rx="3.5"/>
      <rect x="76" y="212" width="152" height="5" rx="2.5" opacity=".6"/>
      <rect x="76" y="228" width="132" height="5" rx="2.5" opacity=".6"/>
      <rect x="76" y="244" width="146" height="5" rx="2.5" opacity=".6"/>
      <rect x="76" y="260" width="96"  height="5" rx="2.5" opacity=".6"/>
    </g>
    <text x="76" y="288" fill="#5C6169" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
          font-size="10.5">lecture-07.pptx</text>
  </g>
  <text x="154" y="332" text-anchor="middle" fill="#7E848C"
        font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">Apache POI</text>
  <text x="154" y="352" text-anchor="middle" fill="#4E535A"
        font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10">extract · chunk</text>

  <!-- arrow -->
  <path d="M290 222 H392" stroke="#FFF" stroke-opacity=".3" fill="none"/>
  <path d="M386 217l8 5-8 5z" fill="#A78BFA" fill-opacity=".8"/>
  <circle r="3" fill="#A78BFA"><animateMotion dur="2.6s" repeatCount="indefinite" path="M290 222 H392"/></circle>

  <!-- RETRIEVAL: vector space -->
  <g>
    <circle cx="560" cy="222" r="104" fill="none" stroke="#FFF" stroke-opacity=".10"/>
    <circle cx="560" cy="222" r="68"  fill="none" stroke="#FFF" stroke-opacity=".07"/>
    <!-- dim neighbours -->
    <g fill="#6B7178">
      <circle cx="498" cy="168" r="3"/><circle cx="614" cy="162" r="3"/>
      <circle cx="486" cy="268" r="3"/><circle cx="630" cy="284" r="3"/>
      <circle cx="540" cy="140" r="2.5"/><circle cx="648" cy="228" r="2.5"/>
      <circle cx="474" cy="220" r="2.5"/><circle cx="578" cy="308" r="2.5"/>
    </g>
    <!-- top-k matches, connected to the query -->
    <g stroke="#FFF" stroke-opacity=".45">
      <line x1="560" y1="222" x2="512" y2="186"/>
      <line x1="560" y1="222" x2="620" y2="196"/>
      <line x1="560" y1="222" x2="536" y2="272"/>
    </g>
    <g fill="#A78BFA" filter="url(#glow)" opacity=".95">
      <circle cx="512" cy="186" r="5"/><circle cx="620" cy="196" r="5"/><circle cx="536" cy="272" r="5"/>
    </g>
    <g fill="#FFFFFF">
      <circle cx="512" cy="186" r="4" fill="#C4B5FD"/><circle cx="620" cy="196" r="4" fill="#C4B5FD"/><circle cx="536" cy="272" r="4" fill="#C4B5FD"/>
    </g>
    <circle cx="560" cy="222" r="9" fill="none" stroke="#FFF" stroke-opacity=".9"/>
    <circle cx="560" cy="222" r="3.5" fill="#22D3EE"/>
    <circle cx="560" cy="222" r="16" fill="none" stroke="#22D3EE" stroke-opacity=".7">
      <animate attributeName="r" values="10;30;10" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values=".75;0;.75" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <text x="560" y="352" text-anchor="middle" fill="#7E848C"
          font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">pgvector · top-k</text>
    <text x="560" y="372" text-anchor="middle" fill="#4E535A"
          font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10">Spring AI embeddings</text>
  </g>

  <!-- arrow -->
  <path d="M676 222 H778" stroke="#FFF" stroke-opacity=".3" fill="none"/>
  <path d="M772 217l8 5-8 5z" fill="#34D399" fill-opacity=".8"/>
  <circle r="3" fill="#34D399"><animateMotion dur="2.6s" begin="1.3s" repeatCount="indefinite" path="M676 222 H778"/></circle>

  <!-- ANSWER card -->
  <g>
    <rect x="800" y="146" width="330" height="164" rx="9" fill="#1A1D21" stroke="#FFF" stroke-opacity=".2"/>
    <text x="820" y="176" fill="#5C6169"
          font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5">claude · grounded</text>
    <g fill="#B9BEC5">
      <rect x="820" y="192" width="252" height="6" rx="3"/>
      <rect x="820" y="210" width="286" height="6" rx="3" opacity=".8"/>
      <rect x="820" y="228" width="214" height="6" rx="3" opacity=".8"/>
      <rect x="820" y="246" width="168" height="6" rx="3" opacity=".55"/>
    </g>
    <!-- citation chip -->
    <rect x="820" y="266" width="132" height="24" rx="12" fill="#34D39914" stroke="#34D399" stroke-opacity=".65"/>
    <circle cx="836" cy="278" r="3" fill="#34D399"/>
    <text x="848" y="282"
          font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" fill="#6EE7B7">slide 14 · L07</text>
    <text x="965" y="352" text-anchor="middle" fill="#7E848C"
          font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">never invented · always cited</text>
  </g>

  <text x="600" y="424" text-anchor="middle" fill="#4E535A"
        font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" letter-spacing="2">
    how TAssist turns a lecture deck into an answer a student can verify
  </text>

  <rect width="1200" height="470" filter="url(#grain)" opacity=".13"/>
</svg>

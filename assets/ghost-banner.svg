<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330"
     role="img" aria-label="Saurabh Kashyap — Software Engineer">
  <defs>
    <linearGradient id="ghost" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="46%"  stop-color="#FFFFFF"/>
      <stop offset="72%"  stop-color="#FFFFFF" stop-opacity=".60"/>
      <stop offset="91%"  stop-color="#7E848C" stop-opacity=".20"/>
      <stop offset="100%" stop-color="#7E848C" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="dust" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#9AA0A8"/>
      <stop offset="50%"  stop-color="#9AA0A8"/>
      <stop offset="80%"  stop-color="#9AA0A8" stop-opacity=".38"/>
      <stop offset="100%" stop-color="#9AA0A8" stop-opacity="0"/>
    </linearGradient>

    <filter id="soft"   x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="50"/></filter>
    <filter id="softer" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="78"/></filter>
    <filter id="bloom"  x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="17"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <radialGradient id="vig" cx="50%" cy="48%" r="74%">
      <stop offset="50%"  stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity=".94"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="330" fill="#000000"/>

  <!-- fog -->
  <g filter="url(#softer)" opacity=".52">
    <ellipse cx="380" cy="150" rx="300" ry="150" fill="#2C3138">
      <animate attributeName="cx" values="380;520;380" dur="28s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".52;.8;.52" dur="21s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="880" cy="130" rx="250" ry="135" fill="#23272D">
      <animate attributeName="cx" values="880;740;880" dur="34s" repeatCount="indefinite"/>
    </ellipse>
  </g>
  <g filter="url(#soft)" opacity=".30">
    <ellipse cx="600" cy="252" rx="380" ry="104" fill="#3A4048">
      <animate attributeName="cy" values="252;220;252" dur="25s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".30;.12;.30" dur="18s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- the name, given room to breathe -->
  <g filter="url(#bloom)" opacity=".22">
    <text x="600" y="176" text-anchor="middle"
          font-family="Helvetica Neue,Helvetica,Arial,sans-serif"
          font-size="104" font-weight="800" letter-spacing="-3.6" fill="#FFFFFF">SAURABH</text>
  </g>
  <text x="600" y="176" text-anchor="middle"
        font-family="Helvetica Neue,Helvetica,Arial,sans-serif"
        font-size="104" font-weight="800" letter-spacing="-3.6" fill="url(#ghost)">SAURABH</text>
  <text x="600" y="256" text-anchor="middle"
        font-family="Georgia,Times New Roman,serif" font-style="italic"
        font-size="82" letter-spacing="-1" fill="url(#dust)">Kashyap</text>

  <!-- quiet role line -->
  <text x="600" y="300" text-anchor="middle" fill="#61666E"
        font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
        font-size="12" letter-spacing="7">SOFTWARE ENGINEER &#183; BOSTON</text>

  <rect width="1200" height="330" fill="url(#vig)"/>
  <rect width="1200" height="330" filter="url(#grain)" opacity=".15"/>
</svg>
